<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HUB DTF</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf8f3;--sec:#c9808a;--card:#fff;--tx:#0f172a;--mut:#64748b;--ac:#121f4c;--acx:#fff;--soft:#ecebf2;--bd:#e5e7eb;--ok:#22c55e;--bad:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--card:#171a23;--tx:#e8eaf0;--mut:#9aa3b2;--ac:#a78bfa;--acx:#1c1233;--soft:#2a2047;--bd:#2a2f3d;--ok:#4ade80;--bad:#f97066}}
:root[data-theme="dark"]{--bg:#0f1117;--card:#171a23;--tx:#e8eaf0;--mut:#9aa3b2;--ac:#a78bfa;--acx:#1c1233;--soft:#2a2047;--bd:#2a2f3d;--ok:#4ade80;--bad:#f97066}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 'Instrument Sans',system-ui,sans-serif}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 16px 4px;max-width:960px;margin:auto}
h1{font-size:21px;margin:0;letter-spacing:-.02em}h2{font-size:20px;margin:14px 0 10px}h3{margin:18px 0 8px;font-size:15px}
#q{width:220px;max-width:100%;border-radius:20px;margin:0}
nav{display:flex;gap:2px;overflow-x:auto;max-width:960px;margin:6px auto;padding:0 12px;border-bottom:1px solid var(--bd)}
nav button{border:1px solid transparent;background:none;color:var(--mut);font:inherit;font-weight:600;padding:8px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--soft);color:var(--ac);border-color:var(--ac)}
#mn{max-width:960px;margin:0 auto;padding:0 16px;text-align:right}#mn button{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 14px;font:inherit;color:var(--tx);cursor:pointer}
main{max-width:960px;margin:auto;padding:4px 16px 48px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.k,.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
.k small{color:var(--mut);display:block}.k b{font-size:21px;letter-spacing:-.02em}
.c{margin-bottom:8px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
label{display:block;font-size:12px;color:var(--mut);font-weight:600}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:8px;margin-top:3px}
input[type=color]{padding:2px;height:38px}
:is(input,select,button,textarea):focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:10px}
.btn{background:var(--ac);color:var(--acx);border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.s{background:none;color:var(--bad);padding:4px 8px}.btn.o{background:var(--soft);color:var(--ac);padding:6px 10px}
.res{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:10px;padding:14px;margin:12px 0}
.res div{display:flex;justify-content:space-between;color:var(--mut)}.res .t{color:var(--tx);font-weight:700;font-size:20px;margin-top:6px;padding-top:6px;border-top:1px solid var(--bd)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--bd);vertical-align:-2px;margin-right:6px}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0}.bar span{width:120px;color:var(--mut)}.bar i{display:block;height:10px;background:var(--ac);border-radius:5px;min-width:3px}
.low{color:var(--bad);font-weight:600}.mut{color:var(--mut)}.tag{background:var(--soft);color:var(--ac);border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600;margin-right:6px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.sub{display:flex;gap:4px;overflow-x:auto}.sub button{border:1px solid var(--bd);background:var(--card);color:var(--mut);font:inherit;font-weight:600;padding:6px 12px;border-radius:20px;cursor:pointer;white-space:nowrap}.sub button.on{background:var(--soft);color:var(--ac);border-color:var(--ac)}
#md:empty{display:none}#md{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;overflow:auto;padding:16px;z-index:9}#md .box{background:var(--card);border-radius:14px;padding:18px;max-width:560px;width:100%;margin:auto}
.it{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:10px;display:grid;gap:8px}.pb{height:8px;background:var(--bd);border-radius:5px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ac)}.pb i.lw{background:var(--bad)}.ita{display:flex;gap:6px;align-items:center}.ib{border:0;background:none;color:var(--mut);padding:7px;border-radius:8px;cursor:pointer;display:inline-flex}.ib:hover{background:var(--soft);color:var(--ac)}.tag.off{background:var(--bd);color:var(--mut)}
.kc{border-radius:10px;padding:12px 14px}.kc small{display:block;opacity:.9}.kc b{font-size:20px}.kc input{background:transparent;border:0;border-bottom:1px solid currentColor;border-radius:0;color:inherit;font-size:20px;font-weight:700;padding:2px 0;margin:0}.kc.p{background:var(--ac);color:var(--acx)}.kc.l{background:#15803d;color:#fff}.kc.c{background:#b45309;color:#fff}
.ml{display:grid;gap:2px;max-height:190px;overflow:auto;margin:4px 0 10px;border:1px solid var(--bd);border-radius:8px;padding:4px}.mi{display:flex;justify-content:space-between;border:0;background:none;color:var(--tx);font:inherit;padding:8px 10px;border-radius:6px;cursor:pointer;text-align:left}.mi.on{background:var(--soft);color:var(--ac)}.mi .mut{font-size:13px}

:root{--ln:#ddd6fe}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ln:#4c3a8a}}:root[data-theme="dark"]{--ln:#4c3a8a}
.tb{display:flex;align-items:center;gap:16px;padding:10px 24px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5;flex-wrap:wrap;max-width:none;margin:0}
.lg{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;padding-right:16px;border-right:1px solid var(--bd)}
.tb nav{flex:1;display:flex;gap:4px;overflow-x:auto;max-width:none;margin:0;padding:0;border:0}
.tb nav button{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;color:var(--mut);padding:8px 14px;border-radius:10px}
.tb nav button.on{background:var(--soft);color:var(--ac);border-color:var(--ln)}
.sr{position:relative}.sr #q{width:230px;border-radius:12px;padding:9px 70px 9px 12px;margin:0;background:var(--bg)}
.sr kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:11px monospace;color:var(--mut);border:1px solid var(--bd);border-radius:5px;padding:1px 6px;background:var(--card)}
#mn:not(:empty){position:fixed;right:20px;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:8;background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:6px;max-width:none;margin:0}
#mn button{border:0;background:none;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;color:var(--tx)}#mn button:hover{background:var(--soft)}
main{max-width:1240px;padding:22px 24px 56px}h2{font-size:24px;font-weight:600}
.ut{display:flex;gap:30px;border-bottom:1px solid var(--bd);margin-bottom:20px;overflow-x:auto}
.ut button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:12px 4px;font:inherit;font-size:17px;color:var(--tx);cursor:pointer;white-space:nowrap}
.ut button.on{color:var(--ac);border-color:var(--ac)}
.flt{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}.flt select{width:auto;min-width:150px;margin:0;background:var(--card);border-radius:10px;padding:10px 12px}.flt .mut{display:inline-flex;align-items:center;gap:6px}
.lk{background:none;border:0;color:var(--ac);font:inherit;cursor:pointer}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.kp{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;box-shadow:0 1px 2px rgba(15,23,42,.04);display:flex;flex-direction:column;gap:6px;min-height:120px}
.kt{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.kt small{text-transform:uppercase;letter-spacing:.03em;color:var(--mut);font-size:13px;font-weight:500}
.bd2{width:42px;height:42px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}.bd2 svg{width:20px;height:20px}
.kp b{font-size:28px;letter-spacing:-.02em}.kp .sb{color:var(--mut);font-size:14px}
.gr{display:grid;gap:16px;margin-top:16px}.gr.c2{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}.gr.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.gr.c2,.gr.c3{grid-template-columns:1fr}.tb{padding:10px 14px}.tb nav{order:3;flex-basis:100%}.sr{margin-left:auto}.sr kbd{display:none}.sr #q{width:170px;padding-right:12px}.lg{border:0}main{padding:16px 14px 56px}}
.cd{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px;box-shadow:0 1px 2px rgba(15,23,42,.04)}.cd h3{margin:0 0 14px;font-size:20px;font-weight:500}
.lgd{display:flex;justify-content:center;gap:18px;margin-top:6px}.lgd span{display:inline-flex;align-items:center;gap:6px}.lgd .dot{width:10px;height:10px;border:0;margin:0}
.it,.k{border-radius:14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}.bar b{white-space:nowrap}
.sr{display:flex;align-items:center}.sy{font-size:12px;color:var(--mut);margin-right:10px;white-space:nowrap}@media (max-width:600px){.sy{display:none}}
@media print{body>*:not(#md){display:none!important}#md{position:static;background:none;padding:0;overflow:visible}#md .box{border:0;box-shadow:none;max-width:none;padding:0}.noprint{display:none!important}}
.emc{text-align:center;color:var(--mut);padding:30px 0;margin:0}.hbr{margin:12px 0}.hbt{display:flex;justify-content:space-between;margin-bottom:5px}.hbt span{color:var(--mut)}.trk{height:12px;background:var(--bd);border-radius:6px;overflow:hidden}.trk i{display:block;height:100%;border-radius:6px}.dn{display:flex;align-items:center;gap:22px;flex-wrap:wrap}.dl{flex:1;min-width:140px}.dl div{display:flex;justify-content:space-between;padding:3px 0}.ibx{background:var(--soft);color:var(--ac);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:10px;font-weight:500}.ibx:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ac);flex:none}.sw{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}.swb{width:28px;height:28px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--bd);cursor:pointer;padding:0}.swb.on{box-shadow:0 0 0 2px var(--tx)}.swc input{width:34px;height:28px;padding:0;margin:0;border-radius:8px;cursor:pointer}
.lock .tb,.lock main{display:none}.authw{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:20;padding:16px}.authw.hide{display:none}.authb{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:24px;width:100%;max-width:380px;display:grid;gap:12px;box-shadow:0 8px 28px rgba(15,23,42,.08)}
