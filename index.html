$('#asu').addEventListener('click',async()=>{const em=$('#ae').value.trim(),pw=$('#ap').value;if(!em||pw.length<6)return am('Informe o e-mail e uma senha de pelo menos 6 caracteres.',1);am('Criando conta…');const{data,error}=await sb.auth.signUp({email:em,password:pw});if(error)am(error.message,1);else if(data.session)start(data.user);else am('Conta criada. Confirme o e-mail recebido e depois entre.')});
$('#arp').addEventListener('click',async()=>{const m=$('#ae').value.trim();if(!m)return am('Digite o e-mail acima.',1);const{error}=await sb.auth.resetPasswordForEmail(m,{redirectTo:location.href.split('#')[0]});am(error?error.message:'Enviamos um link para redefinir a senha.',!!error)});
sb.auth.onAuthStateChange(ev=>{if(ev=='PASSWORD_RECOVERY'){const p=prompt('Digite a nova senha (mínimo 6 caracteres):');if(p)sb.auth.updateUser({password:p}).then(({error})=>alert(error?error.message:'Senha atualizada.'))}});
sb.auth.getSession().then(({data})=>{if(data.session)start(data.session.user)});
